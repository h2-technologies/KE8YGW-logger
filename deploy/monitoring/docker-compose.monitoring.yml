# Local Prometheus + Grafana stack for KE8YGW Logger servers.
#
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Grafana: http://127.0.0.1:3000 (admin / admin on first login)
# Prometheus: http://127.0.0.1:9090
#
# The scrape targets in prometheus/prometheus.yml point at host.docker.internal,
# so the servers can run outside the compose project. Pin both images to a
# sha256 digest before using this in production.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ke8ygw-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    extra_hosts:
      - host.docker.internal:host-gateway

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ke8ygw-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  prometheus-data:
  grafana-data:
