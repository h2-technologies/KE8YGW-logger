name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are safe to cancel. Branch pushes are not: each
  # commit on dev and main needs its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  promotion-policy:
    name: Main promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Default (merge ref) checkout. A pull_request event already runs the
      # workflow file from the merge commit, so pinning the policy script to
      # the base commit would add no protection the workflow itself lacks.
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Require dev promotion or documented hotfix
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-promotion-policy.sh

  # Spec section 3: every crate is built and tested on Linux, Windows and macOS.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ${{ runner.os }}-debug
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  # The club runs headless nodes on Raspberry Pi. A cross-target check catches
  # target-specific breakage without needing an ARM runner or a cross linker.
  raspberry-pi:
    name: Raspberry Pi (aarch64 Linux) check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: linux-aarch64-check
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --locked --workspace --all-targets --target aarch64-unknown-linux-gnu

  ci-result:
    name: CI result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - promotion-policy
      - rust
      - raspberry-pi
    steps:
      - name: Check required job results
        shell: bash
        env:
          PROMOTION_RESULT: ${{ needs.promotion-policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PI_RESULT: ${{ needs.raspberry-pi.result }}
        run: |
          set -euo pipefail
          # The promotion policy only runs for pull requests into main, so it
          # may be skipped. The Rust and Pi jobs always run and must pass.
          case "$PROMOTION_RESULT" in
            success|skipped) ;;
            *) echo "Main promotion policy did not pass: $PROMOTION_RESULT" >&2; exit 1 ;;
          esac
          for result in "$RUST_RESULT" "$PI_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not pass: $result" >&2
              exit 1
            fi
          done
