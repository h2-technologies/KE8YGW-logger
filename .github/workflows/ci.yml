name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are safe to cancel. Branch pushes are not: each
  # commit on dev and main needs its own verdict, and a production tag is only
  # released when the tagged commit has a completed successful main CI run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  promotion-policy:
    name: Main promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Default (merge ref) checkout. A pull_request event already runs the
      # workflow file from the merge commit, so pinning the policy script to
      # the base commit would add no protection the workflow itself lacks,
      # while breaking every pull request that edits the policy — including
      # the one that introduces it. A pull request that rewrites its own gate
      # is caught in review, like any other workflow change.
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Require dev promotion or documented hotfix
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-promotion-policy.sh

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      api: ${{ steps.detect.outputs.api }}
      governance: ${{ steps.detect.outputs.governance }}
      docs_links: ${{ steps.detect.outputs.docs_links }}
      version: ${{ steps.detect.outputs.version }}
      tauri: ${{ steps.detect.outputs.tauri }}
      container: ${{ steps.detect.outputs.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${base:-}" ]]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$base" "$head")"
          fi

          rust=false
          api=false
          governance=false
          docs_links=false
          version=false
          tauri=false
          container=false
          all_expensive=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == .github/workflows/* || "$file" == Cargo.toml || "$file" == Cargo.lock || "$file" == rust-toolchain.toml || "$file" == rust-toolchain ]]; then
              all_expensive=true
            fi
            if [[ "$file" == *.md ]]; then
              docs_links=true
            fi
            if [[ "$file" == openapi/* || "$file" == scripts/check_api_contract.py || "$file" == crates/ham-core/src/api_contract.rs || "$file" == crates/ham-server/* ]]; then
              api=true
              rust=true
            fi
            if [[ "$file" == *.md || "$file" == .github/CODEOWNERS || "$file" == .github/ISSUE_TEMPLATE/* || "$file" == .github/PULL_REQUEST_TEMPLATE.md || "$file" == scripts/governance-check.ps1 ]]; then
              governance=true
            fi
            if [[ "$file" == Cargo.toml || "$file" == crates/*/Cargo.toml || "$file" == src-tauri/Cargo.toml || "$file" == src-tauri/tauri.conf.json || "$file" == ios/KE8YGWLogger/KE8YGWLogger.xcodeproj/project.pbxproj || "$file" == ios/KE8YGWLogger/KE8YGWLogger/Resources/Info.plist || "$file" == openapi/api-v1.yaml || "$file" == openapi/api-v1-baseline.json || "$file" == .github/workflows/ci.yml || "$file" == .github/workflows/release.yml || "$file" == scripts/check_versions.py || "$file" == RELEASE.md || "$file" == docs/BRANCHING_AND_RELEASE_CHANNELS.md ]]; then
              version=true
            fi
            if [[ "$file" == crates/* || "$file" == src-tauri/* ]]; then
              rust=true
            fi
            if [[ "$file" == src-tauri/* || "$file" == crates/ham-client/* || "$file" == crates/ham-core/* ]]; then
              tauri=true
            fi
            if [[ "$file" == Dockerfile.server || "$file" == .dockerignore || "$file" == crates/ham-server/* || "$file" == crates/ham-core/* || "$file" == Cargo.toml || "$file" == Cargo.lock || "$file" == rust-toolchain.toml ]]; then
              container=true
            fi
          done <<< "$files"

          if [[ "$all_expensive" == true ]]; then
            rust=true
            api=true
            governance=true
            docs_links=true
            version=true
            tauri=true
            container=true
          fi

          {
            echo "rust=$rust"
            echo "api=$api"
            echo "governance=$governance"
            echo "docs_links=$docs_links"
            echo "version=$version"
            echo "tauri=$tauri"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$files"

  preflight:
    name: Ubuntu preflight and policy
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: linux-debug
          cache-save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Format
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: API contract
        if: needs.changes.outputs.api == 'true'
        run: python scripts/check_api_contract.py

      - name: Version consistency
        if: needs.changes.outputs.version == 'true'
        run: python scripts/check_versions.py

      - name: Documentation links
        if: needs.changes.outputs.docs_links == 'true'
        run: python scripts/check_docs_links.py

      - name: Governance
        if: needs.changes.outputs.governance == 'true'
        shell: pwsh
        run: ./scripts/governance-check.ps1

      # Every scope, not just the ones checked in this job: tauri-validation and
      # container-validation are separate jobs, so claiming nothing was selected
      # while either of them runs would be wrong.
      - name: No expensive work selected
        if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.api != 'true' && needs.changes.outputs.governance != 'true' && needs.changes.outputs.docs_links != 'true' && needs.changes.outputs.version != 'true' && needs.changes.outputs.tauri != 'true' && needs.changes.outputs.container != 'true'
        run: echo "Only files outside CI validation scopes changed."

  rust-quality:
    name: Ubuntu Rust quality
    runs-on: ubuntu-latest
    needs:
      - changes
      - preflight
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: linux-debug
          cache-save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/linux-desktop-deps

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: JavaScript syntax
        run: node --check crates/ham-client/web/app.js

  platform-validation:
    name: Platform validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - changes
      - preflight
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: ${{ runner.os }}-debug
          cache-save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Compile platform binaries
        run: cargo build --locked -p ham-client --bin ham-client -p ham-server --bin ham-server

      - name: Platform credential tests
        run: cargo test --locked -p ham-core credential

      - name: Runtime log and filesystem tests
        run: cargo test --locked -p ham-core diagnostics

  tauri-validation:
    name: Tauri validation
    runs-on: ubuntu-latest
    needs:
      - changes
      - preflight
    if: needs.changes.outputs.tauri == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: linux-debug
          cache-save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/linux-desktop-deps

      - name: Check Tauri runtime crate
        run: cargo check --locked -p ke8ygw-logger-desktop --all-targets

  container-validation:
    name: Server container
    runs-on: ubuntu-latest
    needs:
      - changes
      - preflight
    if: needs.changes.outputs.container == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Build image
        run: docker build -f Dockerfile.server -t ham-server:ci .

      - name: Smoke image
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d ham-server:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..10}; do
            if docker logs "$container_id" 2>&1 | grep -q "ham-server listening"; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "$container_id" | grep -q true; then
              docker logs "$container_id" >&2
              exit 1
            fi
            sleep 1
          done
          docker logs "$container_id" >&2
          exit 1

  ci-result:
    name: CI result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - promotion-policy
      - preflight
      - rust-quality
      - platform-validation
      - tauri-validation
      - container-validation
    steps:
      - name: Check required job results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROMOTION_RESULT: ${{ needs.promotion-policy.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RUST_RESULT: ${{ needs.rust-quality.result }}
          PLATFORM_RESULT: ${{ needs.platform-validation.result }}
          TAURI_RESULT: ${{ needs.tauri-validation.result }}
          CONTAINER_RESULT: ${{ needs.container-validation.result }}
        run: |
          set -euo pipefail
          # Change detection decides which validation jobs run at all, so it is
          # the one job that must actually succeed. Skipping it is not a pass:
          # if it fails, every job downstream of it is skipped and treating
          # those skips as success would report a green CI that validated
          # nothing.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            echo "No validation job can be trusted, so CI cannot pass." >&2
            exit 1
          fi

          for result in "$PROMOTION_RESULT" "$PREFLIGHT_RESULT" "$RUST_RESULT" "$PLATFORM_RESULT" "$TAURI_RESULT" "$CONTAINER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "A required CI job did not pass: $result" >&2
                exit 1
                ;;
            esac
          done

  internal-artifact:
    name: Internal dev artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: ci-result
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Write internal build manifest
        id: manifest
        uses: ./.github/actions/build-manifest
        with:
          channel: internal-dev
          directory: dist/internal
          note: "Internal validation artifact only. Not a beta or production release."

      - name: Upload internal build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.manifest.outputs.artifact }}
          path: dist/internal
          retention-days: 7

  beta-artifact:
    name: Beta build manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-result
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Write beta build manifest
        id: manifest
        uses: ./.github/actions/build-manifest
        with:
          channel: beta-main
          directory: dist/beta
          note: "Beta tester artifact metadata only. Not a production release."

      - name: Upload beta build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.manifest.outputs.artifact }}
          path: dist/beta
          retention-days: 30
