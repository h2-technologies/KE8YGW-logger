name: iOS Native

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs only. Every commit pushed to dev and
  # main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This workflow had no change selection at all, so a documentation-only pull
  # request still spent five to eight minutes on a macOS runner building the
  # Rust FFI and booting a simulator. macOS minutes bill at ten times the Linux
  # rate, which made this the most expensive job in the repository to leave
  # ungated. The classifier mirrors the one in ci.yml, and the expensive job
  # skips rather than disappearing, so the check still reports.
  changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${base:-}" ]]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$base" "$head")"
          fi

          ios=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            # Workspace-wide inputs are treated conservatively, as in ci.yml: a
            # lockfile or toolchain change can move the FFI build under us.
            if [[ "$file" == .github/workflows/ios.yml || "$file" == Cargo.toml || "$file" == Cargo.lock || "$file" == rust-toolchain.toml ]]; then
              ios=true
            fi
            # ham-core is the shared library the FFI wraps, so it counts too.
            if [[ "$file" == ios/* || "$file" == scripts/ios/* || "$file" == crates/ham-ios-ffi/* || "$file" == crates/ham-core/* ]]; then
              ios=true
            fi
          done <<< "$files"

          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files"

  ios:
    name: Rust FFI and iOS Simulator
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Show toolchains
        run: |
          set -euo pipefail
          echo "host arch: $(uname -m)"
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "error: iOS CI expects an arm64 macOS runner for aarch64-apple-ios-sim builds." >&2
            exit 1
          fi
          swift --version
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Build and stage simulator Rust FFI
        env:
          CONFIGURATION: Debug
          IOS_RUST_TARGETS: aarch64-apple-ios-sim
          CARGO_PROFILE_DEV_DEBUG: "1"
          CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: "off"
        run: bash scripts/ios/build-rust.sh

      - name: Pick iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [[ -z "$DEVICE" ]]; then
            DEVICE="iPhone 16"
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build and test iOS simulator target
        env:
          SKIP_RUST_XCFRAMEWORK_BUILD: "1"
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "ios/KE8YGWLogger/KE8YGWLogger.xcodeproj" \
            -scheme "KE8YGWLogger" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -resultBundlePath "build/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload Xcode result bundle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-xcresult
          path: build/ios-tests.xcresult
          if-no-files-found: ignore

  ios-result:
    name: iOS result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - ios
    permissions:
      contents: read
    steps:
      - name: Check required job results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          # Change detection decides whether the simulator job runs at all, so
          # it is the one job that must actually succeed. A skipped job reports
          # as success to branch protection, so without this a failed checkout
          # or diff in the classifier would skip iOS validation and still look
          # green — the same fail-open the `CI result` job exists to prevent in
          # ci.yml. If we do not know whether iOS was affected, we have not
          # validated it.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            echo "Whether this change reaches iOS is unknown, so this cannot pass." >&2
            exit 1
          fi

          case "$IOS_RESULT" in
            success|skipped) ;;
            *)
              echo "iOS validation did not pass: $IOS_RESULT" >&2
              exit 1
              ;;
          esac
