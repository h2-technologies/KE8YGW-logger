name: Branch promotion policy

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  promotion-policy:
    name: promotion-policy
    runs-on: ubuntu-latest
    steps:
      # Default (merge ref) checkout, matching the Main promotion policy job in
      # ci.yml. See the comment there for why the base commit is not pinned.
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Validate branch promotion
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-promotion-policy.sh
