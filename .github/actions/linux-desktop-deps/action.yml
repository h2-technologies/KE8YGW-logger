name: Install Linux desktop dependencies
description: >-
  Install the system libraries the Tauri desktop shell and the WebKitGTK-linked
  crates need on Ubuntu runners.

runs:
  using: composite
  steps:
    - name: Install Linux desktop dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
