name: Feature request
description: Suggest a focused improvement for KE8YGW Logger.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the expected workflow or outcome.
    validations:
      required: true
  - type: dropdown
    id: user-type
    attributes:
      label: User type
      options:
        - Operator
        - Checker
        - Event admin
        - Single operator (one-node event)
        - Maintainer
        - Other
    validations:
      required: true
  - type: checkboxes
    id: platform-impact
    attributes:
      label: Platform impact
      options:
        - label: Desktop GUI
        - label: Terminal UI
        - label: CLI or headless node
        - label: Relay
        - label: Sync between stations
        - label: Unknown
  - type: textarea
    id: offline-implications
    attributes:
      label: Offline implications
      description: How should this behave without network connectivity?
    validations:
      required: true
  - type: textarea
    id: security-privacy
    attributes:
      label: Security or privacy implications
      description: Describe any key, PIN, authorization, sync, relay, or log data impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs considered.
    validations:
      required: false
